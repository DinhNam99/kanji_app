name: Release

# Builds shippable artifacts when a version tag is pushed (e.g. `v1.0.0`) and
# attaches them to a GitHub Release. Can also be run manually for an existing tag.
#
# No signing secrets are required: the Android `release` build type currently
# falls back to the debug signing config, and iOS is built with `--no-codesign`.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.24.4"
  FLUTTER_CHANNEL: stable

jobs:
  android:
    name: Android (APK + AAB)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # On a tag push this is the tag; on manual dispatch it's the input.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release App Bundle
        run: flutter build appbundle --release

      - name: Collect artifacts
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/kanji-app-${RELEASE_TAG}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/kanji-app-${RELEASE_TAG}.aab"

      - name: Upload APK/AAB
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS (unsigned)
    runs-on: macos-latest
    timeout-minutes: 60
    # Unsigned iOS builds are the most environment-sensitive part of the pipeline;
    # keep them non-blocking so Android artifacts still publish if this flakes.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package Runner.app
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          mkdir -p dist
          cd build/ios/iphoneos
          zip -r -q "$GITHUB_WORKSPACE/dist/kanji-app-ios-${RELEASE_TAG}.zip" Runner.app

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: ios
          path: dist/*.zip
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: [android, ios]
    runs-on: ubuntu-latest
    # Publish as long as Android succeeded, even if the iOS job flaked.
    if: ${{ always() && needs.android.result == 'success' }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List release files
        run: ls -la dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: false
